name: Catalog
# перезапуск після переходу в публічне репо (2026-10-27)

# Парсинг сайту магазину (scripts/scrape_catalog.py) → знімок каталогу в гілці data/catalog.
# Знімок кладеться в APK як «запасний» каталог (без інтернету); застосунок і сам оновлюється з сайту.
# Запуск: вручну (меню CARAVAN LEAN → 14), щопонеділка, і коли змінено парсер.
on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Скільки сторінок обійти (максимум)"
        default: "1500"
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/scrape_catalog.py"
      - "scripts/site_fetch.py"
      - ".github/workflows/catalog.yml"

concurrency:
  group: catalog
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -q -r scripts/requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - name: Scrape
        run: |
          set -o pipefail
          python3 scripts/scrape_catalog.py out --max-pages "${{ github.event.inputs.max_pages || '1500' }}" | tee scrape.out
          rc=${PIPESTATUS[0]}
          tail -n 30 out/scrape-log.txt 2>/dev/null | while IFS= read -r l; do echo "::notice title=SCRAPE_LOG::$l"; done
          if [ "$rc" != 0 ]; then echo "::error title=Каталог::Товарів не знайдено (код $rc)"; exit 1; fi
          tr '\n' ' ' < out/catalog-summary.txt | sed 's/^/::notice title=CATALOG::/'; echo
      - name: Save to data/catalog
        run: |
          set -euo pipefail
          cd out
          git init -q -b data/catalog
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "catalog $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data/catalog
          echo "::notice title=CATALOG_SAVED::гілка data/catalog"
